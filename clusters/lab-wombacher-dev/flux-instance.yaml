# Applied once by ansible/cluster.yml, then synced by Flux from this file
---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    # Upgrades Flux to every new 2.x release
    version: "2.x"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: "cluster.local"
  sync:
    kind: GitRepository
    url: "https://github.com/wombelix/k8s-mgmt.git"
    ref: "refs/heads/main"
    path: "clusters/lab-wombacher-dev"
  kustomize:
    patches:
      # Decrypt SOPS files with the age key from task secret
      - patch: |
          - op: add
            path: /spec/decryption
            value:
              provider: sops
              secretRef:
                name: sops-age
        target:
          kind: Kustomization
