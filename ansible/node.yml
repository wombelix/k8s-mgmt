---
- name: Configure k3s node
  hosts: all
  gather_facts: true
  become: true

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded

    - name: Restart k3s
      ansible.builtin.service:
        name: k3s
        state: restarted

    - name: Restart apt-daily-upgrade timer
      ansible.builtin.systemd:
        name: apt-daily-upgrade.timer
        state: restarted
        daemon_reload: true

  tasks:
    # Disabling root login during a root run locks out a host without admin users
    - name: Refuse to run as root
      ansible.builtin.assert:
        that: ansible_user != 'root'
        fail_msg: Run bootstrap.yml first, then site.yml as an admin user.

    - name: Disable root and password login
      ansible.builtin.copy:
        content: |
          PermitRootLogin no
          PasswordAuthentication no
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Enable unattended-upgrades
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        validate: apt-config -c %s dump

    # Starts between 04:00 and 04:30 Europe/Berlin, after the k3s upgrade window
    - name: Create apt-daily-upgrade timer drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/apt-daily-upgrade.timer.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Move apt-daily-upgrade into the maintenance window
      ansible.builtin.copy:
        content: |
          [Timer]
          # Empty value resets the packaged 06:00 schedule
          OnCalendar=
          OnCalendar=*-*-* 04:00 Europe/Berlin
          RandomizedDelaySec=30m
        dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart apt-daily-upgrade timer

    - name: Reboot after upgrades when needed
      ansible.builtin.copy:
        content: |
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "now";
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        owner: root
        group: root
        mode: '0644'
        validate: apt-config -c %s dump

    - name: Create k3s config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: '0755'

    # Public IPs as fallback if DNS fails
    - name: Write k3s config
      ansible.builtin.copy:
        content: |
          tls-san:
            - "{{ inventory_hostname }}"
            - "{{ ansible_facts['default_ipv4']['address'] }}"
            - "{{ ansible_facts['default_ipv6']['address'] }}"
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: '0600'
      notify: Restart k3s

    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/bin/k3s-install.sh
        owner: root
        group: root
        mode: '0755'

    # Install once. system-upgrade-controller handles upgrades
    - name: Install k3s
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-install.sh
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_CHANNEL: stable
...
