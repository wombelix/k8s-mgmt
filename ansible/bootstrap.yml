---
- name: Bootstrap k3s node
  hosts: all
  gather_facts: false
  become: true

  vars:
    # Only root exists after a rebuild. Play vars win over inventory vars
    ansible_user: root

  tasks:
    - name: Create admin users
      ansible.builtin.user:
        name: "{{ item }}"
        create_home: true
        password: '*' # no password, SSH key login only
        shell: /bin/bash
        state: present
      loop: "{{ admin_users }}"

    - name: Set SSH authorized keys
      ansible.posix.authorized_key:
        user: "{{ item }}"
        key: "{{ lookup('file', 'files/' + item + '.pub') }}"
        exclusive: true
        manage_dir: true
        state: present
      loop: "{{ admin_users }}"

    - name: Grant passwordless sudo
      ansible.builtin.copy:
        content: "{{ item }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: "/etc/sudoers.d/{{ item }}"
        owner: root
        group: root
        mode: '0440'
        validate: visudo -csf %s
      loop: "{{ admin_users }}"
...
