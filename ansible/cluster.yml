# Runs on the node, so no kubeconfig leaves it
---
- name: Bootstrap Flux on the cluster
  hosts: all
  gather_facts: false
  become: true

  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  vars:
    # lab.wombacher.dev uses clusters/lab-wombacher-dev
    cluster_dir: "{{ playbook_dir }}/../clusters/{{ inventory_hostname | replace('.', '-') }}"

  tasks:
    - name: Wait for the k3s kubeconfig
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml

    - name: Install helm install script dependencies
      ansible.builtin.apt:
        name:
          - curl
          - openssl
          - tar
        state: present

    - name: Download helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
        dest: /usr/local/bin/get-helm-4.sh
        owner: root
        group: root
        mode: '0755'

    # Install once, only used for the Flux Operator one-shot below
    - name: Install helm
      ansible.builtin.command:
        cmd: /usr/local/bin/get-helm-4.sh
        creates: /usr/local/bin/helm

    - name: Check the Flux Operator release
      ansible.builtin.command:
        cmd: /usr/local/bin/helm status flux-operator --namespace flux-system
      register: flux_operator_release
      changed_when: false
      failed_when: >-
        flux_operator_release.rc != 0
        and 'release: not found' not in flux_operator_release.stderr

    # Install once. Flux upgrades the operator from Git afterwards
    - name: Install Flux Operator
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/helm install flux-operator
          oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
          --namespace flux-system
          --create-namespace
      when: flux_operator_release.rc != 0
      changed_when: true

    - name: Check the FluxInstance
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get fluxinstance flux --namespace flux-system
      register: flux_instance
      changed_when: false
      failed_when: >-
        flux_instance.rc != 0
        and 'NotFound' not in flux_instance.stderr

    # Apply once. Flux syncs the file from Git afterwards
    - name: Apply the FluxInstance
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl apply --server-side --filename -
        stdin: "{{ lookup('ansible.builtin.file', cluster_dir + '/flux-instance.yaml') }}"
      when: flux_instance.rc != 0
      changed_when: true
...
