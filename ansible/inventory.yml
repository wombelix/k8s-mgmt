# One host is one single-node cluster
all:
  hosts:
    lab.wombacher.dev:
      # Pod and Service ranges. IPv4 is the same everywhere, each cluster gets its own ULA prefix
      k3s_cluster_cidr: "10.42.0.0/16,fd61:4655:2980::/56"
      k3s_service_cidr: "10.43.0.0/16,fd61:4655:2980:100::/112"
  vars:
    # Manual runs. The pipeline sets -e ansible_user=k8s-mgmt
    ansible_user: wombelix
    ansible_python_interpreter: /usr/bin/python3
    # One account per SSH key, key file is files/<name>.pub
    admin_users:
      - wombelix
      - k8s-mgmt
