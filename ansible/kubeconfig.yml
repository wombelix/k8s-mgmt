# Convenience copy for local tools. Not for CI, the key cannot be revoked
---
- name: Fetch the kubeconfig
  hosts: all
  gather_facts: false
  become: true

  vars:
    kubeconfig_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/{{ inventory_hostname }}.yaml"

  tasks:
    # The kubeconfig holds the cluster admin key
    - name: Read the k3s kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig
      no_log: true

    # k3s names cluster, context and user "default", which clashes across kubeconfigs
    - name: Write the local kubeconfig
      ansible.builtin.copy:
        content: >-
          {{ k3s_kubeconfig.content | b64decode
          | replace('https://127.0.0.1:6443', 'https://' + inventory_hostname + ':6443')
          | replace('name: default', 'name: ' + inventory_hostname)
          | replace('cluster: default', 'cluster: ' + inventory_hostname)
          | replace('user: default', 'user: ' + inventory_hostname)
          | replace('current-context: default', 'current-context: ' + inventory_hostname) }}
        dest: "{{ kubeconfig_path }}"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true
      diff: false
...
