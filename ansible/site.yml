---
- name: Configure k3s node
  hosts: all
  gather_facts: false
  become: true

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded

  tasks:
    # Disabling root login during a root run locks out a host without admin users
    - name: Refuse to run as root
      ansible.builtin.assert:
        that: ansible_user != 'root'
        fail_msg: Run bootstrap.yml first, then site.yml as an admin user.

    - name: Disable root and password login
      ansible.builtin.copy:
        content: |
          PermitRootLogin no
          PasswordAuthentication no
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Enable unattended-upgrades
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        validate: apt-config -c %s dump

    # apt-daily-upgrade.timer runs between 06:00 and 07:00
    - name: Reboot after upgrades when needed
      ansible.builtin.copy:
        content: |
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "07:30";
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        owner: root
        group: root
        mode: '0644'
        validate: apt-config -c %s dump
...
