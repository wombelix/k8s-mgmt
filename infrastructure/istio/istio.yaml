# Istio ambient from the upstream OCI Helm charts, installed in the documented order
# https://istio.io/latest/docs/ambient/install/helm/
# https://istio.io/latest/docs/ambient/install/platform-prerequisites/#k3s
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 24h
  url: oci://ghcr.io/istio/release/charts/base
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    # Upgrades to every new 1.x release
    semver: "1.x"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 24h
  url: oci://ghcr.io/istio/release/charts/istiod
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "1.x"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-cni
  namespace: istio-system
spec:
  interval: 24h
  url: oci://ghcr.io/istio/release/charts/cni
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "1.x"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  interval: 24h
  url: oci://ghcr.io/istio/release/charts/ztunnel
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "1.x"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: istio-base
  values:
    global:
      platform: k3s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  dependsOn:
    - name: istio-base
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: istiod
  values:
    profile: ambient
    global:
      platform: k3s
    # The chart default of 500m and 2Gi is sized for large clusters
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    # Gateway pods need it to pass Pod Security restricted
    gateways:
      seccompProfile:
        type: RuntimeDefault
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: istio-system
spec:
  dependsOn:
    - name: istiod
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: istio-cni
  values:
    profile: ambient
    global:
      platform: k3s
    # Infrastructure namespaces stay out of the mesh, a new one must be added here
    excludeNamespaces:
      - kube-system
      - istio-system
      # The ingress gateway is a mesh proxy itself and must not be captured by ztunnel
      - istio-ingress
      - flux-system
      - cert-manager
      - pod-identity-webhook
      - system-upgrade
    ambient:
      # Every pod in every other namespace joins the mesh, unless it has the label istio.io/dataplane-mode=none
      enablementSelectors:
        - podSelector:
            matchExpressions:
              - key: istio.io/dataplane-mode
                operator: NotIn
                values: ["none"]
          namespaceSelector: {}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  dependsOn:
    - name: istio-cni
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: ztunnel
  values:
    global:
      platform: k3s
