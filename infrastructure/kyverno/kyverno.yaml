# Kyverno from the upstream OCI Helm chart, it generates resources such as a NetworkPolicy per namespace
# https://kyverno.io/docs/installation/methods/
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 24h
  url: oci://ghcr.io/kyverno/charts/kyverno
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    # Upgrades to every new 3.x chart release
    semver: "3.x"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: kyverno
  values:
    # Only the admission and background controllers are needed to generate resources
    cleanupController:
      enabled: false
    reportsController:
      enabled: false
