# One ingress policy per namespace from one template, a new namespace needs one line here.
# mesh: true for namespaces whose pods join the Istio mesh, see excludeNamespaces in infrastructure/istio/istio.yaml
# https://fluxoperator.dev/docs/crd/resourceset/
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: network-policies
  namespace: flux-system
spec:
  inputs:
    - namespace: kube-system
    - namespace: default
      mesh: true
    - namespace: cert-manager
    - namespace: pod-identity-webhook
    - namespace: system-upgrade
    - namespace: istio-system
    - namespace: istio-ingress
  resourcesTemplate: |
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: default-ingress
      namespace: << inputs.namespace >>
    spec:
      podSelector: {}
      policyTypes:
        - Ingress
      ingress:
        # Pods in other namespaces cannot connect. The node itself always can,
        # so kubelet health checks and API server calls to webhooks keep working.
        - from:
            - podSelector: {}
        <<- if get inputs "mesh" >>
        # Lets the ingress gateway forward outside requests to the apps.
        # Istio sends all traffic between pods encrypted on port 15008.
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: istio-ingress
          ports:
            - port: 15008
              protocol: TCP
        <<- end >>
