# One ingress policy per namespace from one template, a new namespace needs one line here
# https://fluxoperator.dev/docs/crd/resourceset/
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: network-policies
  namespace: flux-system
spec:
  inputs:
    - namespace: kube-system
    - namespace: default
    - namespace: cert-manager
    - namespace: pod-identity-webhook
    - namespace: system-upgrade
    - namespace: istio-system
  resources:
    # Only pods in the same namespace may connect, the k3s policy controller always allows the node and so the API server
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-ingress
        namespace: << inputs.namespace >>
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - podSelector: {}
