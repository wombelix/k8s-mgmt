# Upstream ships only raw manifests, referenced by tag so Renovate can bump the version
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pod-identity-webhook
resources:
  - namespace.yaml
  - issuer.yaml
  - https://raw.githubusercontent.com/aws/amazon-eks-pod-identity-webhook/v0.6.19/deploy/auth.yaml
  - https://raw.githubusercontent.com/aws/amazon-eks-pod-identity-webhook/v0.6.19/deploy/deployment-base.yaml
  - https://raw.githubusercontent.com/aws/amazon-eks-pod-identity-webhook/v0.6.19/deploy/mutatingwebhook.yaml
  - https://raw.githubusercontent.com/aws/amazon-eks-pod-identity-webhook/v0.6.19/deploy/service.yaml
images:
  - name: IMAGE
    newName: public.ecr.aws/eks/amazon-eks-pod-identity-webhook
    newTag: v0.6.19
patches:
  # Pods without their own AWS_REGION get eu-central-1
  - target:
      kind: Deployment
      name: pod-identity-webhook
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: --aws-default-region=eu-central-1
  # Upstream names assume the default namespace
  - target:
      kind: Certificate
      name: pod-identity-webhook
    patch: |
      - op: replace
        path: /spec/commonName
        value: pod-identity-webhook.pod-identity-webhook.svc
      - op: replace
        path: /spec/dnsNames
        value:
          - pod-identity-webhook
          - pod-identity-webhook.pod-identity-webhook
          - pod-identity-webhook.pod-identity-webhook.svc
      - op: replace
        path: /spec/issuerRef/kind
        value: Issuer
  - target:
      kind: MutatingWebhookConfiguration
      name: pod-identity-webhook
    patch: |
      - op: replace
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
        value: pod-identity-webhook/pod-identity-webhook
  # Replaced by issuer.yaml
  - patch: |
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: selfsigned
