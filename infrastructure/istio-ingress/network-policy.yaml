# Anyone may reach the gateway on HTTP and HTTPS
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web
  namespace: istio-ingress
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: ingress
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
