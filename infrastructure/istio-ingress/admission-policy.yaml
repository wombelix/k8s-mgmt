# Built into Kubernetes, works without Kyverno or any other webhook
# https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ingress-gateway-rules
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes", "listenersets"]
  validations:
    # Outside istio-ingress, only cert-manager's challenge routes may attach to the shared Gateway.
    # A parentRef without namespace points into the route's own namespace, never to the shared Gateway.
    - expression: >-
        request.kind.kind != 'HTTPRoute' ||
        object.metadata.namespace == 'istio-ingress' ||
        (has(object.metadata.labels) && 'acme.cert-manager.io/http01-solver' in object.metadata.labels) ||
        !object.spec.parentRefs.exists(p,
          (!has(p.kind) || p.kind == 'Gateway') &&
          has(p.namespace) && p.namespace == 'istio-ingress' && p.name == 'ingress')
      message: "Only cert-manager challenge routes may attach to the shared Gateway, apps attach to their ListenerSet"
    # ListenerSets may only add HTTPS listeners, so no app serves plain HTTP
    - expression: >-
        request.kind.kind != 'ListenerSet' ||
        object.spec.listeners.all(l, l.protocol == 'HTTPS')
      message: "ListenerSets may only add HTTPS listeners"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ingress-gateway-rules
spec:
  policyName: ingress-gateway-rules
  validationActions: [Deny]
