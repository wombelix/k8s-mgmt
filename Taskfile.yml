version: '3'

silent: true

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  deps:
    desc: Install Ansible collections into the repo
    cmd: ansible-galaxy collection install -r collections/requirements.yml

  bootstrap:
    desc: Create the admin users as root, only after a VM rebuild
    cmd: ansible-playbook ansible/bootstrap.yml {{.CLI_ARGS}}

  site:
    desc: Configure the node as the inventory user
    cmd: ansible-playbook ansible/site.yml {{.CLI_ARGS}}

  kubeconfig:
    desc: Write the cluster kubeconfig to ~/.kube for local tools
    cmd: ansible-playbook ansible/kubeconfig.yml {{.CLI_ARGS}}

  secret:
    desc: Push the sops-age Secret from SSM, after a rebuild or key rotation
    summary: |
      TARGET is the SSH destination, for example
      task secret TARGET=lab.wombacher.dev
      task secret TARGET=k8s-mgmt@lab.wombacher.dev
    requires:
      vars: [TARGET]
    vars:
      AWS_REGION: eu-central-1
      AGE_KEY_PARAM: /projects/k8s-mgmt/age-private-key
      # Run on the node, the key arrives on stdin
      CREATE_SECRET: >-
        sudo k3s kubectl create secret generic sops-age --namespace flux-system
        --from-file=age.agekey=/dev/stdin --dry-run=client --output yaml
      APPLY_SECRET: sudo k3s kubectl apply --server-side --filename -
    cmds:
      # KEY is not exported, child processes never see it. printf is a shell builtin
      - |
        KEY="$(aws ssm get-parameter --region {{.AWS_REGION}} --name {{.AGE_KEY_PARAM}} --with-decryption --query Parameter.Value --output text)"
        if [ -z "$KEY" ]; then
          echo "Could not read {{.AGE_KEY_PARAM}} from SSM" >&2
          exit 1
        fi
        printf '%s' "$KEY" | ssh {{.TARGET}} '{{.CREATE_SECRET}} | {{.APPLY_SECRET}}'
